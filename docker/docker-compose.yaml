
services:
  _TEMP_DEEPHOLE_DB_INIT_SERVICE:
    image: _TEMP_IMAGE_NAME_:_TEMP_IMAGE_VERSION
    container_name: _TEMP_DEEPHOLE_DB_INIT_SERVICE
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python /app/sql/init_db.py
    volumes:
      - ${DATA_VOLUME}:/data
      - ${LOG_VOLUME}:/logs
    restart: "no"
    environment:
      - PYTHONPATH=/app 
      - ENABLE_CRON=false

  _TEMP_DEEPHOLE_API_SERVICE:
    image: _TEMP_IMAGE_NAME_:_TEMP_IMAGE_VERSION
    container_name: _TEMP_DEEPHOLE_API_SERVICE
    depends_on:
      - _TEMP_DEEPHOLE_DB_INIT_SERVICE
    volumes:
      - ${DATA_VOLUME}:/data
      - ${LOG_VOLUME}:/logs
    environment:
      - PYTHONPATH=/app 
      - TZ=${TIME_ZONE}
      - API_SERVICE_NAME=_TEMP_DEEPHOLE_API_SERVICE
      - API_PORT=${API_PORT}
      - ENABLE_CRON=false
      - IFIND_REFRESH_TOKEN=${IFIND_REFRESH_TOKEN}
      - NUMBA_NUM_THREADS=auto
      - OMP_NUM_THREADS=auto
      - MKL_NUM_THREADS=auto
    ports:
      - "${API_PORT}:${API_PORT}"
    command: uvicorn api:app --host 0.0.0.0 --port ${API_PORT}
    restart: unless-stopped

  _TEMP_DEEPHOLE_FETCHER_SERVICE:
    image: _TEMP_IMAGE_NAME_:_TEMP_IMAGE_VERSION
    container_name: _TEMP_DEEPHOLE_FETCHER_SERVICE
    depends_on:
      - _TEMP_DEEPHOLE_DB_INIT_SERVICE
    volumes:
      - ${DATA_VOLUME}:/data
      - ${LOG_VOLUME}:/logs
    environment:
      - PYTHONPATH=/app 
      - TZ=${TIME_ZONE}
      - API_SERVICE_NAME=_TEMP_DEEPHOLE_API_SERVICE
      - API_PORT=${API_PORT}
      - DASHBOARD_SERVICE_NAME=_TEMP_DEEPHOLE_DASHBOARD_SERVICE
      - DASHBOARD_PORT=${DASHBOARD_PORT}
      - STOCK_FETCHER_SERVICE_NAME=_TEMP_DEEPHOLE_FETCHER_SERVICE
      - ENABLE_CRON=true
      - CRON_SCHEDULE_CN=${CRON_SCHEDULE_CN}
      - CRON_SCHEDULE_HK=${CRON_SCHEDULE_HK}
      - CRON_SCHEDULE_US=${CRON_SCHEDULE_US}
    restart: unless-stopped

  # _TEMP_DEEPHOLE_DASHBOARD_SERVICE:
