  #     - DASHBOARD_PORT=${DASHBOARD_PORT}
  #     - ENABLE_CRON=false
  #   ports:
  #     - "${DASHBOARD_PORT}:${DASHBOARD_PORT}"   # 👈 从 .env 读取端口
  #   command: streamlit run dashboard.py --server.port ${DASHBOARD_PORT} --server.address 0.0.0.0
  #   restart: unless-stopped

  _TEMP_DEEPHOLE_DASHBOARD_SERVICE:
    image: _TEMP_IMAGE_NAME_:_TEMP_IMAGE_VERSION
    container_name: _TEMP_DEEPHOLE_DASHBOARD_SERVICE

    depends_on:
      - _TEMP_DEEPHOLE_DB_INIT_SERVICE
      - _TEMP_DEEPHOLE_API_SERVICE

    volumes:
      - ${DATA_VOLUME}:/data
      - ${LOG_VOLUME}:/logs

    environment:
      - TZ=${TIME_ZONE}
      - API_SERVICE_NAME=_TEMP_DEEPHOLE_API_SERVICE
      - API_PORT=${API_PORT}
      - DASHBOARD_PORT=${DASHBOARD_PORT}
      - ENABLE_CRON=false
    ports:
      - "${DASHBOARD_PORT}:3000"

    command: nginx -g "daemon off;"
    restart: unless-stopped

volumes:
  duckdb_data:
  duckdb_logs: