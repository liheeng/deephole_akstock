events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 3000;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 🔥 强制 JS MIME（最保险）
        location ~* \.js$ {
            types { application/javascript js; }
        }
        
        location ~* \.(js|mjs|css)$ {
           add_header Cache-Control "no-cache, no-store, must-revalidate";
           expires 0;
        }
    }
}